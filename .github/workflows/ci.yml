name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  repository_dispatch:
    types: [blog-rebuild]
  workflow_dispatch:

env:
  NODE_VERSION: 22

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint, typecheck, content validation and tests
        run: npm run ci:check

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build static site
        env:
          PUBLIC_COMMIT_SHA: ${{ github.sha }}
          PUBLIC_DASHBOARD_URL: https://dashboard.devsaderiva.com.br
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error

  audit:
    name: SEO, links and security
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Security and dependency scan
        run: npm run check:security

      - name: SEO check
        run: npm run check:seo

      - name: Broken internal link check
        run: npm run check:links

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'repository_dispatch'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Run Lighthouse CI
        run: npm run lighthouse

      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: lhci-report
          if-no-files-found: warn

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [quality, build, audit, lighthouse]
    if: |
      needs.quality.result == 'success' &&
      needs.build.result == 'success' &&
      needs.audit.result == 'success' &&
      (needs.lighthouse.result == 'success' || needs.lighthouse.result == 'skipped') &&
      (
        (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
        github.event_name == 'repository_dispatch' ||
        github.event_name == 'workflow_dispatch'
      )

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install runtime dependencies
        run: npm ci --omit=dev --legacy-peer-deps

      - name: Package release
        run: |
          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='.astro' \
            --exclude='.env' \
            --exclude='.env.local' \
            --exclude='.env.production' \
            --exclude='.env.development.local' \
            --exclude='.env.test.local' \
            --exclude='.env.production.local' \
            -czf /tmp/devs-a-deriva-release.tgz .

      - name: Package runtime artifact
        run: tar -czf /tmp/devs-a-deriva-runtime.tgz package.json package-lock.json node_modules dist public

      - name: Upload release to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          SSH_OPTS=(
            -o StrictHostKeyChecking=accept-new
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=10
            -i ~/.ssh/deploy_key
          )

          retry() {
            local attempts="$1"
            shift

            local attempt=1
            until "$@"; do
              if [ "$attempt" -ge "$attempts" ]; then
                return 1
              fi
              echo "Upload failed; retrying $((attempt + 1))/$attempts in 10s..."
              sleep 10
              attempt=$((attempt + 1))
            done
          }

          retry 5 scp "${SSH_OPTS[@]}" \
            /tmp/devs-a-deriva-release.tgz \
            "$VPS_USER@$VPS_HOST:/tmp/devs-a-deriva-release.tgz"

          split -b 50m /tmp/devs-a-deriva-runtime.tgz /tmp/devs-a-deriva-runtime.tgz.part-
          ssh "${SSH_OPTS[@]}" "$VPS_USER@$VPS_HOST" 'rm -f /tmp/devs-a-deriva-runtime.tgz /tmp/devs-a-deriva-runtime.tgz.part-*'
          for part in /tmp/devs-a-deriva-runtime.tgz.part-*; do
            retry 5 scp "${SSH_OPTS[@]}" "$part" "$VPS_USER@$VPS_HOST:/tmp/$(basename "$part")"
          done
          ssh "${SSH_OPTS[@]}" "$VPS_USER@$VPS_HOST" \
            'cat /tmp/devs-a-deriva-runtime.tgz.part-* > /tmp/devs-a-deriva-runtime.tgz && rm -f /tmp/devs-a-deriva-runtime.tgz.part-*'

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          PUBLIC_COMMIT_SHA: ${{ github.sha }}
          DEPLOY_BRANCH: main
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 60m
          envs: PUBLIC_COMMIT_SHA,DEPLOY_BRANCH
          script: |
            set -euo pipefail
            APP_DIR="/opt/devs-a-deriva"
            RELEASE_DIR="/tmp/devs-a-deriva-release"
            rm -rf "$RELEASE_DIR"
            mkdir -p "$RELEASE_DIR" "$APP_DIR"
            tar -xzf /tmp/devs-a-deriva-release.tgz -C "$RELEASE_DIR"
            if command -v rsync >/dev/null 2>&1; then
              rsync -a --delete \
                --exclude='.git/' \
                --exclude='.env' \
                --exclude='.env.local' \
                --exclude='.env.production' \
                --exclude='node_modules/' \
                --exclude='dist/' \
                --exclude='.astro/' \
                "$RELEASE_DIR/" "$APP_DIR/"
            else
              tar -xzf /tmp/devs-a-deriva-release.tgz -C "$APP_DIR"
            fi
            SKIP_REMOTE_GIT=1 RUNTIME_ARTIFACT_TAR=/tmp/devs-a-deriva-runtime.tgz bash "$APP_DIR/scripts/deploy.sh"

  smoke:
    name: Post-deploy smoke and healthcheck
    runs-on: ubuntu-latest
    needs: deploy
    if: needs.deploy.result == 'success'

    steps:
      - name: Wait for service to be ready
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            for i in $(seq 1 20); do
              if curl -sf --max-time 5 "http://127.0.0.1:4321/health.json" > /dev/null 2>&1; then
                echo "Serviço disponível (tentativa $i)"
                exit 0
              fi
              echo "Tentativa $i/20 — aguardando 5s..."
              sleep 5
            done
            echo "Serviço não ficou disponível em 100s"
            exit 1

      - name: Smoke test via localhost
        id: smoke
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            BASE="http://127.0.0.1:4321"
            ERRORS=0
            for path in "/" "/manifesto/" "/devs/" "/categorias/tech/" "/categorias/carreira/" "/sitemap.xml" "/robots.txt" "/health.json"; do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 8 "$BASE$path")
              if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
                echo "OK  $path -> $STATUS"
              else
                echo "ERR $path -> $STATUS"
                ERRORS=$((ERRORS + 1))
              fi
            done
            HEALTH=$(curl -sf --max-time 5 "$BASE/health.json" || echo "{}")
            if ! echo "$HEALTH" | grep -q '"status":"ok"' || ! echo "$HEALTH" | grep -q '"app":"devs-a-deriva"'; then
              echo "ERR /health.json: payload inválido — $HEALTH"
              ERRORS=$((ERRORS + 1))
            fi
            if [ "$ERRORS" -gt 0 ]; then
              echo "Smoke test falhou: $ERRORS rota(s) com erro"
              exit 1
            fi
            echo "Smoke test OK em $BASE"

      - name: Rollback on smoke failure
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: bash /opt/devs-a-deriva/scripts/rollback.sh
