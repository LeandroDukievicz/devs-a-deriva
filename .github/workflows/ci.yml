name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  repository_dispatch:
    types: [blog-rebuild]
  workflow_dispatch:

env:
  NODE_VERSION: 22
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint, typecheck, content validation and tests
        run: npm run ci:check

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build static site
        env:
          PUBLIC_COMMIT_SHA: ${{ github.sha }}
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error

  audit:
    name: SEO, links and security
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Security and dependency scan
        run: npm run check:security

      - name: SEO check
        run: npm run check:seo

      - name: Broken internal link check
        run: npm run check:links

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'repository_dispatch'

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Run Lighthouse CI
        run: npm run lighthouse

      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: lhci-report
          if-no-files-found: warn

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [quality, build, audit, lighthouse]
    if: |
      needs.quality.result == 'success' &&
      needs.build.result == 'success' &&
      needs.audit.result == 'success' &&
      (needs.lighthouse.result == 'success' || needs.lighthouse.result == 'skipped') &&
      (
        (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
        github.event_name == 'repository_dispatch' ||
        github.event_name == 'workflow_dispatch'
      )

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          PUBLIC_COMMIT_SHA: ${{ github.sha }}
          DEPLOY_BRANCH: main
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: PUBLIC_COMMIT_SHA,DEPLOY_BRANCH
          script: bash /opt/devs-a-deriva/scripts/deploy.sh

  smoke:
    name: Post-deploy smoke and healthcheck
    runs-on: ubuntu-latest
    needs: deploy
    if: needs.deploy.result == 'success'
    env:
      BASE_URL: ${{ secrets.PUBLIC_SITE_URL || 'https://devsaderiva.com.br' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Wait for service to be ready
        run: |
          for i in $(seq 1 15); do
            if curl -sf --max-time 5 "$BASE_URL/health.json" > /dev/null 2>&1; then
              echo "Serviço disponível (tentativa $i)"
              exit 0
            fi
            echo "Tentativa $i/15 — aguardando 5s..."
            sleep 5
          done
          echo "Serviço não ficou disponível em 75s"
          exit 1

      - name: Smoke test public site
        id: smoke
        run: npm run smoke:test

      - name: Rollback on smoke failure
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: bash /opt/devs-a-deriva/scripts/rollback.sh
