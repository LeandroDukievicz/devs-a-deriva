services:
  blog:
    build:
      context: .
      args:
        PUBLIC_DASHBOARD_URL: ${PUBLIC_DASHBOARD_URL:-https://dashboard.devsaderiva.com.br}
        PUBLIC_COMMIT_SHA: ${PUBLIC_COMMIT_SHA:-local}
    restart: unless-stopped
    ports:
      - "127.0.0.1:4321:4321"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:4321/health.json').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
